<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo do Grafo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #11111b;
      color: #cdd6f4;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 4px; }
    p { margin: 4px 0 14px; color: #a6adc8; }
    canvas {
      background: #1e1e2e;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Jogo de Grafos</h1>
  <p>Leve a bolinha azul até a vermelha. Clique nas bolinhas com borda verde!</p>
  <canvas id="tela" width="760" height="400"></canvas>

  <script>
    // VÉRTICES: número = nome, [x, y] = posição na tela
    const vertices = {
      1: [100, 200], 2: [260, 80], 3: [260, 320], 4: [420, 200],
      5: [580, 80], 6: [580, 320], 7: [680, 200],
    };

    // ARESTAS: linhas que ligam os vértices
    const arestas = [[1, 2], [1, 3], [2, 4], [3, 4], [4, 5], [4, 6], [5, 7], [6, 7]];

    let pontos = 0;
    let jogador = 1;
    let mensagem = "";

    // devolve os vértices ligados ao vértice v
    function vizinhos(v) {
      return arestas.filter(a => a.includes(v)).map(a => (a[0] === v ? a[1] : a[0]));
    }

    // sorteia um destino que NÃO seja o jogador nem um vizinho dele
    function sortearDestino() {
      const opcoes = Object.keys(vertices).map(Number)
        .filter(v => v !== jogador && !vizinhos(jogador).includes(v));
      return opcoes[Math.floor(Math.random() * opcoes.length)];
    }

    let destino = sortearDestino();

    const tela = document.getElementById("tela");
    const ctx = tela.getContext("2d");

    function desenhar() {
      ctx.clearRect(0, 0, tela.width, tela.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "white";
      ctx.font = "bold 20px Segoe UI, Arial";
      ctx.fillText("Pontos: " + pontos, 380, 25);

      ctx.fillStyle = "#a6e3a1";
      ctx.font = "14px Segoe UI, Arial";
      ctx.fillText(mensagem, 380, 380);

      // linhas
      ctx.strokeStyle = "#585b70";
      ctx.lineWidth = 4;
      for (const [a, b] of arestas) {
        ctx.beginPath();
        ctx.moveTo(...vertices[a]);
        ctx.lineTo(...vertices[b]);
        ctx.stroke();
      }

      // bolinhas
      for (const num in vertices) {
        const n = Number(num);
        const [x, y] = vertices[n];
        let cor = "#cdd6f4", borda = "#45475a", largura = 3;
        if (n === destino) cor = "#f38ba8";               // vermelho
        if (n === jogador) cor = "#89b4fa";               // azul
        if (vizinhos(jogador).includes(n)) {              // borda verde = pode ir
          borda = "#a6e3a1";
          largura = 5;
        }
        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.fillStyle = cor;
        ctx.fill();
        ctx.strokeStyle = borda;
        ctx.lineWidth = largura;
        ctx.stroke();

        ctx.fillStyle = "#1e1e2e";
        ctx.font = "bold 18px Segoe UI, Arial";
        ctx.fillText(n, x, y);
      }
    }

    // roda quando o jogador clica na tela
    tela.addEventListener("click", (evento) => {
      const caixa = tela.getBoundingClientRect();
      const escala = tela.width / caixa.width;      // ajusta se a tela estiver redimensionada
      const cx = (evento.clientX - caixa.left) * escala;
      const cy = (evento.clientY - caixa.top) * escala;

      for (const n of vizinhos(jogador)) {
        const [x, y] = vertices[n];
        if (Math.hypot(cx - x, cy - y) < 28) {
          jogador = n;
          mensagem = "";
          if (jogador === destino) {
            pontos++;
            destino = sortearDestino();
            mensagem = "Acertou! A vermelha mudou de lugar!";
          }
          desenhar();
          return;
        }
      }
    });

    desenhar();
  </script>
</body>
</html>
